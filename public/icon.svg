<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Temperature Compare">
  <!-- An enamel plaque rather than a rounded app-store tile: the whole UI is
       cream signs keylined in ink and bolted to a teal wall, so the mark is
       one of those signs seen head-on. -->
  <rect width="64" height="64" fill="#f6efdf"/>

  <!-- Butt-capped strokes, not tapered triangles: a triangle narrows to
       nothing and its rays vanish entirely at the 16px tab size. The cardinal
       rays overshoot the field and are cropped flush by the keyline below,
       which is what keeps the burst from looking like eight loose blocks. -->
  <g stroke="#d94f2b" stroke-width="6" stroke-linecap="butt">
    <path d="M45.50 32.00L62.00 32.00"/>
    <path d="M41.55 41.55L53.21 53.21"/>
    <path d="M32.00 45.50L32.00 62.00"/>
    <path d="M22.45 41.55L10.79 53.21"/>
    <path d="M18.50 32.00L2.00 32.00"/>
    <path d="M22.45 22.45L10.79 10.79"/>
    <path d="M32.00 18.50L32.00 2.00"/>
    <path d="M41.55 22.45L53.21 10.79"/>
  </g>

  <circle cx="32" cy="32" r="10" fill="#e9b02a" stroke="#16232a" stroke-width="3"/>

  <!-- Drawn last so it crops the rays instead of being overdrawn by them. -->
  <path d="M0 0h64v64H0z M6 6v52h52V6z" fill="#16232a" fill-rule="evenodd"/>
</svg>
